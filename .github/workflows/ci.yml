name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      eval:
        description: "Run the eval subset"
        type: boolean
        default: false
      provider:
        description: "mock or anthropic (anthropic needs the ANTHROPIC_API_KEY secret)"
        default: mock

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.eval
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Eval subset (every 3rd case)
        run: pnpm eval --provider ${{ inputs.provider }} --subset 3 --label ci
      - name: Retrieval experiments
        run: pnpm eval:retrieval ci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: evals/results }
